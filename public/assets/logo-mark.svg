<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" className="w-full h-full">
  <defs>
    <!-- Premium Polished White & Metallic Chrome Gradients -->
    <linearGradient id="glowWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="80%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="arrowGradient" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Top-Left Crescent Blade Arc -->
  <path
    d="M 58 12 C 40 14 26 26 21 44 C 18 53 20 63 25 70 C 27 66 29 62 32 58 C 30 52 30 45 34 38 C 39 28 47 21 57 18 C 63 16 69 16 74 18 C 71 14 65 12 58 12 Z"
    fill="url(#glowWhite)"
    filter="url(#softGlow)"
  />

  <!-- Top-Right Dynamic Forward Wing Arc -->
  <path
    d="M 64 15 C 78 18 90 28 97 41 C 100 48 101 58 99 66 C 96 63 93 60 89 58 C 91 50 90 43 85 36 C 80 28 72 20 62 18 C 60 17 58 16 64 15 Z"
    fill="url(#glowWhite)"
    filter="url(#softGlow)"
  />

  <!-- Lower Sweeping 'G' Body & Inward Horizontal Fin -->
  <path
    d="M 99 66 C 98 78 91 90 80 97 C 69 104 55 105 43 100 C 37 98 31 93 28 87 C 31 88 36 90 41 90 C 50 90 60 85 67 78 C 72 73 75 66 76 59 C 81 60 86 62 91 64 C 89 71 86 77 80 83 C 72 90 61 95 49 95 C 53 98 58 100 64 100 C 77 100 89 94 96 83 C 101 76 102 68 99 66 Z"
    fill="url(#glowWhite)"
    filter="url(#softGlow)"
  />

  <!-- Bottom-Left Circuit Node Anchor -->
  <circle cx="41" cy="76" r="10.5" fill="url(#arrowGradient)" filter="url(#softGlow)" />
  <circle cx="41" cy="76" r="5" fill="#0A0A0B" />
  <circle cx="41" cy="76" r="2.5" fill="url(#accentOrange)" />

  <!-- Diagonal Cybernetic Arrow Shaft -->
  <path
    d="M 45 72 L 78 34 L 85 41 L 52 79 Z"
    fill="url(#arrowGradient)"
    filter="url(#softGlow)"
  />

  <!-- Dynamic Arrow Head Pointing Up-Right -->
  <polygon
    points="75,23 94,26 90,44 84,36 71,32"
    fill="url(#glowWhite)"
    filter="url(#softGlow)"
  />
</svg>
