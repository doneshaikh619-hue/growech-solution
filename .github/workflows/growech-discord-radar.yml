name: Growech 24/7 Discord & Tech Lead Radar

on:
  schedule:
    # Runs every 5 minutes around the clock (24/7/365)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from phone/browser anytime

jobs:
  scan-discord-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Discord Lead Radar
        working-directory: scripts/discord-radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_USER_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
        run: |
          node discord-radar.cjs

      - name: Commit Seen Leads State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/discord-radar/seen_discord_posts.json scripts/discord-radar/captured_leads.json scripts/discord-radar/radar.log || true
          if git diff --staged --quiet; then
            echo "No new leads state to commit."
          else
            git commit -m "chore(radar): update seen discord leads cache [skip ci]"
            git push origin main
          fi
