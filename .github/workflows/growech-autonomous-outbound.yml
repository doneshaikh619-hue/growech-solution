name: Growech Autonomous 24/7 Outbound Dispatcher

on:
  schedule:
    # 05:00 UTC = 10:00 AM Pakistan Time (PKT)
    # 09:00 UTC = 02:00 PM Pakistan Time (PKT)
    # 13:00 UTC = 06:00 PM Pakistan Time (PKT)
    - cron: '0 5,9,13 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outbound-runner
  cancel-in-progress: false

jobs:
  outbound:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Outbound Dependencies
        run: |
          npm install nodemailer --no-save

      - name: Execute Autonomous Cloud Outbound Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USER: ${{ secrets.SMTP_USER || 'growech.site@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_NAME: "Mustafa | Growech Solution"
          FROM_EMAIL: "growech.site@gmail.com"
        run: |
          node scripts/cloud-outbound/autonomous-cloud-sender.cjs

      - name: Commit & Push Sent History to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/cloud-outbound/sent_leads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(outbound): update sent leads telemetry log [skip ci]" && git push)
