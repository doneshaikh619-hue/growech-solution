name: Growech 24/7 Facebook Client Lead Radar

on:
  schedule:
    # Runs every 10 minutes around the clock (24/7/365)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from phone/browser anytime

jobs:
  scan-facebook-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Radar Dependencies
        working-directory: scripts/facebook-radar
        run: |
          npm install

      - name: Run Facebook Lead Radar
        working-directory: scripts/facebook-radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node facebook-radar.cjs

      - name: Commit Seen Leads State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/facebook-radar/seen_facebook_posts.json scripts/facebook-radar/captured_leads.json scripts/facebook-radar/facebook_radar.log || true
          if git diff --staged --quiet; then
            echo "No new leads state to commit."
          else
            git commit -m "chore(radar): update seen facebook leads cache [skip ci]"
            git push origin main
          fi
